{% extends "base.html" %}
{% block title %}로그인{% endblock %}
{% block body %}
<div class="login-wrap">
  <section class="panel">
    <h2>관리자 로그인</h2>
    <p class="sub">명함 제작 시스템을 사용하려면 로그인해 주세요.</p>
    {% if not has_admin %}
    <div class="notice">관리자 계정이 아직 없습니다. 터미널에서 <code>flask --app run create-admin</code>을 실행해 계정을 만들어 주세요.</div>
    {% endif %}
    <form method="post" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label for="username">아이디</label>
      <input id="username" name="username" autocomplete="username" value="{{ request.form.username or '' }}" autofocus>
      <label for="password">비밀번호</label>
      <input id="password" name="password" type="password" autocomplete="current-password">
      <div class="hint">{{ error or '' }}</div>
      <div class="btns"><button class="primary" type="submit">로그인</button></div>
    </form>
  </section>
</div>
{% endblock %}
